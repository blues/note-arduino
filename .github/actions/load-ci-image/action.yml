name: 'Load note-arduino CI Docker image'
description: 'Download the CI image artifact built earlier in this run and load it into Docker'
runs:
  using: 'composite'
  steps:
    - name: Download image artifact
      uses: actions/download-artifact@v8
      with:
        name: note_arduino_ci_image
        path: /tmp

    - name: Load Docker image
      shell: bash
      run: |
        docker load --input /tmp/note_arduino_ci_image.tar

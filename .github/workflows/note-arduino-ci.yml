name: Note Arduino CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild of the CI Docker image (published only when run on master)'
        required: false
        type: boolean
        default: false

# Superseded PR runs are cancelled. The per-run suffix keeps master runs
# (which publish the CI image) from cancelling or replacing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CI_IMAGE_REPO: ghcr.io/blues/note_arduino_ci

jobs:
  ci_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # packages: read is required to pull the private notestation-client base image.
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.check.outputs.image }}
      built: ${{ steps.check.outputs.build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is derived from the Dockerfile alone. The Dockerfile copies no
      # files from the build context; if that changes, hash those files too.
      - name: Compute image tag from Dockerfile hash
        id: tag
        run: |
          hash=$(sha256sum .devcontainer/ci/Dockerfile | cut -c1-16)
          echo "tag=${CI_IMAGE_REPO}:dockerfile-${hash}" >> "$GITHUB_OUTPUT"

      # An existing tag is resolved to its digest once, so every job in the run
      # uses the same image even if the tag is pushed again mid-run.
      - name: Check whether the image needs to be built
        id: check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          FORCE_BUILD: ${{ inputs.force_build == true }}
        run: |
          if [ "$FORCE_BUILD" != "true" ] && digest=$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}' 2> /dev/null); then
            echo "Found $TAG at $digest"
            echo "image=${CI_IMAGE_REPO}@${digest}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $TAG"
            echo "image=${TAG}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/ci/Dockerfile
          tags: ${{ steps.tag.outputs.tag }}
          outputs: type=docker,dest=/tmp/note_arduino_ci_image.tar

      - name: Upload image artifact
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: note_arduino_ci_image
          path: /tmp/note_arduino_ci_image.tar
          retention-days: 7

  run_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci_image]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load CI Docker image
        if: needs.ci_image.outputs.built == 'true'
        uses: ./.github/actions/load-ci-image

      - name: Print CI image tool versions
        env:
          IMAGE: ${{ needs.ci_image.outputs.image }}
        run: |
          docker run --rm --entrypoint bash \
                          --user root \
                          "$IMAGE" \
                          -c 'dpkg -l lcov | tail -1; python3 --version; lcov --version'

      - name: Run tests
        env:
          IMAGE: ${{ needs.ci_image.outputs.image }}
        run: |
          docker run --rm --volume "$(pwd)":/note-arduino/ \
                          --workdir /note-arduino/ \
                          --entrypoint ./scripts/run_unit_tests.sh \
                          --user root \
                          --env CTEST_PARALLEL_LEVEL="$(nproc)" \
                          --env NOTE_ARDUINO_BUILD_JOBS="$(nproc)" \
                          "$IMAGE" \
                          --coverage --mem-check

      - name: Adjust lcov source file paths for Coveralls
        run: sudo sed -i 's/\/note-arduino\///g' ./coverage/lcov.info

      - name: Publish test coverage
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info

  build_examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci_image]
    strategy:
      fail-fast: false
      matrix:
        example-sketch:
          - ./examples/Example0_LibrarylessCommunication/Example0_LibrarylessCommunication.ino
          - ./examples/Example1_NotecardBasics/Example1_NotecardBasics.ino
          - ./examples/Example2_PeriodicCommunications/Example2_PeriodicCommunications.ino
          - ./examples/Example3_InboundPolling/Example3_InboundPolling.ino
          - ./examples/Example4_InboundInterrupts/Example4_InboundInterrupts.ino
          - ./examples/Example5_UsingTemplates/Example5_UsingTemplates.ino
          - ./examples/Example6_SensorTutorial/Example6_SensorTutorial.ino
          - ./examples/Example7_PowerControl/Example7_PowerControl.ino
          - ./examples/Example8_BinarySendReceive/Example8_BinarySendReceive.ino
          - ./examples/Example9_BinarySendReceiveChunked/Example9_BinarySendReceiveChunked.ino
          - ./examples/Example10_OutboardFirmwareUpdate/Example10_OutboardFirmwareUpdate.ino
        board:
          # Order: fqbn, extra-flags (matches build_example.sh parameter order)
          # Note: index URLs are pre-configured in Dockerfile, no need to specify here
          # adafruit: https://raw.githubusercontent.com/adafruit/arduino-board-index/gh-pages/package_adafruit_index.json
          - fqbn: adafruit:nrf52:feather52840:softdevice=s140v6
          - fqbn: adafruit:samd:adafruit_feather_m4
          # arduino: (built-in, no additional index needed)
          - fqbn: arduino:avr:uno
          - fqbn: arduino:mbed_nano:nano33ble
            # The mbed_nano platform generates compiler warning.
            # https://github.com/arduino/ArduinoCore-mbed/issues/1024
            extra-flags: "-DMBED_CONF_NORDIC_NRF_LF_CLOCK_SRC=NRF_LF_SRC_XTAL"
          - fqbn: arduino:samd:mkrzero
          # esp32: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          - fqbn: esp32:esp32:featheresp32
          # rp2040: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          - fqbn: rp2040:rp2040:rpipico
          # SparkFun: https://raw.githubusercontent.com/sparkfun/Arduino_Apollo3/main/package_sparkfun_apollo3_index.json
          - fqbn: SparkFun:apollo3:sfe_artemis_thing_plus
          # STMicroelectronics: https://raw.githubusercontent.com/stm32duino/BoardManagerFiles/main/package_stmicroelectronics_index.json
          - fqbn: STMicroelectronics:stm32:Blues:pnum=CYGNET
          - fqbn: STMicroelectronics:stm32:Blues:pnum=SWAN_R5
          - fqbn: STMicroelectronics:stm32:GenF4:pnum=FEATHER_F405
          - fqbn: STMicroelectronics:stm32:Nucleo_32:pnum=NUCLEO_L432KC
        exclude:
          # Binary examples don't fit in AVR Uno's flash
          - board:
              fqbn: arduino:avr:uno
            example-sketch: ./examples/Example8_BinarySendReceive/Example8_BinarySendReceive.ino
          - board:
              fqbn: arduino:avr:uno
            example-sketch: ./examples/Example9_BinarySendReceiveChunked/Example9_BinarySendReceiveChunked.ino

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v7

      - name: Load CI docker image
        if: needs.ci_image.outputs.built == 'true'
        uses: ./.github/actions/load-ci-image

      - name: Compile Examples
        env:
          IMAGE: ${{ needs.ci_image.outputs.image }}
        run: |
          docker run --rm --volume "$(pwd)":/note-arduino/ \
                          --workdir /note-arduino/ \
                          --entrypoint ./scripts/build_example.sh \
                          "$IMAGE" \
                          "${{ matrix.board.fqbn }}" \
                          "${{ matrix.example-sketch }}" \
                          "${{ matrix.board.extra-flags }}"

  # Runs on every passing master run, one run at a time. The hash tag is
  # write-once (force_build may overwrite it only from master's head), and it
  # only ever holds images whose master run passed tests and examples. latest
  # follows the hash tag for the Dockerfile at master's head, so every publish
  # converges on the same image regardless of order, and latest is repaired
  # after a Dockerfile revert or a failed push.
  publish_ci_image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci_image, run_tests, build_examples]
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-ci-image
      queue: max

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look up the head of master
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          hash=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.devcontainer/ci/Dockerfile?ref=${sha}" -H "Accept: application/vnd.github.raw" | sha256sum | cut -c1-16)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${CI_IMAGE_REPO}:dockerfile-${hash}" >> "$GITHUB_OUTPUT"

      - name: Check whether the rebuilt image should be pushed
        id: check
        if: needs.ci_image.outputs.built == 'true'
        env:
          TAG: ${{ needs.ci_image.outputs.tag }}
          FORCE_BUILD: ${{ inputs.force_build == true && steps.head.outputs.sha == github.sha }}
        run: |
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif out=$(docker buildx imagetools inspect "$TAG" 2>&1); then
            echo "::notice::$TAG was already published by another run; leaving it as is"
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif grep -q "not found" <<< "$out"; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      - name: Download image artifact
        if: steps.check.outputs.push == 'true'
        uses: actions/download-artifact@v8
        with:
          name: note_arduino_ci_image
          path: /tmp

      - name: Push rebuilt image
        if: steps.check.outputs.push == 'true'
        env:
          TAG: ${{ needs.ci_image.outputs.tag }}
        run: |
          docker load --input /tmp/note_arduino_ci_image.tar
          docker push "$TAG"

      - name: Point latest at the published image
        env:
          TAG: ${{ needs.ci_image.outputs.tag }}
          HEAD_TAG: ${{ steps.head.outputs.tag }}
        run: |
          if [ "$TAG" != "$HEAD_TAG" ]; then
            echo "::notice::master's Dockerfile has changed since this commit; latest is left for a run that matches it"
            exit 0
          fi
          image="${CI_IMAGE_REPO}@$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}')"
          echo "Pointing latest at $image"
          docker buildx imagetools create --prefer-index=false --tag "${CI_IMAGE_REPO}:latest" "$image"

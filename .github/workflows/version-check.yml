name: Version Check

on:
  push:
    branches: [ master ]
    paths:
      - 'src/NoteDefines.h'
      - 'library.properties'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/NoteDefines.h'
      - 'library.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check version consistency
        run: |
          chmod +x scripts/check_version.sh
          ./scripts/check_version.sh
